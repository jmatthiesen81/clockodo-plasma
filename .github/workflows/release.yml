name: Release

# Tag push "1.2.3" (or "1.2.3-rc.1"): tests, builds and checks the Arch package
# and creates a GitHub release (marked as pre-release when the tag has a "-"
# suffix) with the source tarball and SHA256SUMS. The release notes are the
# section of that version in CHANGELOG.md (scripts/changelog-section.sh),
# followed by the notes GitHub generates; a release tag without a CHANGELOG
# section fails early.
#
# No binary package is published here: the installable package is built by
# the pacman repository from the source tarball, and its signing key never
# comes to GitHub.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # fail before the builds when versions or release notes do not fit
      # (pre-releases fall back to the base version and [Unreleased])
      - name: Check version numbers
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Check CHANGELOG section
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus
          python -m pip install -e '.[test]'

      - name: Test
        env:
          CLOCKODO_TEST_SYSTEM: "1"
        run: scripts/test.sh

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build and check the Arch package
        run: scripts/build-package.sh --check

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Source tarball and checksums
        run: |
          mkdir dist
          name="clockodo-plasma-$GITHUB_REF_NAME"
          # git archive is stable, unlike GitHub's automatic archives
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" "$GITHUB_REF_NAME"
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          # tags with a suffix (1.2.3-rc.1) are pre-releases
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clockodo Plasma $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag \
            "${args[@]}"
